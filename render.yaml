# ============================================
# Render Blueprint - Verdant Agro
# ============================================
# Defines the web service deployment on Render.
#
# The app uses MongoDB for persistence. Render does
# NOT provide a managed MongoDB service, so the
# connection string points to an external MongoDB
# (e.g. MongoDB Atlas free tier) provided as a
# secret during the Blueprint creation flow.
#
# Deploy by:
#   1. Pushing this repo to GitHub
#   2. In Render Dashboard: New > Blueprint
#   3. Selecting this repository
#   4. Pasting your MONGO_URI when prompted
#
# SECURITY
#   Render generates a strong random JWT_SECRET automatically
#   (generateValue: true). If it is ever missing, the server
#   generates one on first boot and persists it in MongoDB, so
#   the app boots cleanly either way. To set it by hand instead:
#       openssl rand -hex 32
# ============================================

services:
  # ==============================
  # Web Application (frontend + API)
  # ==============================
  - type: web
    name: verdant-agro
    runtime: node
    plan: free
    healthCheckPath: /api/health

    # Build and start commands (Node.js runtime)
    #   Build compiles the Tailwind CSS into public/styles.css
    #   Start runs the Express server (frontend + API)
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      # JWT signing secret. Render generates a strong random value.
      # If it is ever missing, the app auto-generates one and stores it in
      # MongoDB on first boot, so the service still starts cleanly.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Name of the httpOnly session cookie that carries the JWT.
      - key: AUTH_COOKIE_NAME
        value: kcnp_session

      # Public URL of this service. Used to build password-reset links and as
      # the CORS allow-list origin in production. Update to your real domain.
      - key: FRONTEND_URL
        sync: false

      # Cross-origin allow-list for the API. Leave unset in production to keep
      # same-origin only (recommended). Set to a specific origin only if the
      # frontend is hosted on a different domain (comma-separated).
      - key: CORS_ORIGIN
        sync: false

      # Rate limiting defaults
      - key: RATE_LIMIT_WINDOW
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "100"

      # MongoDB connection string (secret).
      # You MUST supply this value when the Blueprint is
      # first created (it will not be synced afterward).
      # Example (Atlas): mongodb+srv://<user>:<password>@cluster.mongodb.net/verdant
      - key: MONGO_URI
        sync: false
