name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    env:
      NODE_ENV: test
      # Never reach a real DB — mongodb-memory-server supplies one in-process.
      JWT_SECRET: ci-test-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Jest + in-memory MongoDB)
        run: npm test

      - name: Build production CSS
        run: npm run build

      - name: Boot check
        run: node -e "require('./server/app')(); console.log('app loads ok');"