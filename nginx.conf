# ============================================
# Vuna Digital - Nginx Configuration
# ============================================
# Reverse proxy configuration for production
# serving static files and proxying API requests.
# ============================================

# HTTP -> redirect to HTTPS (uncomment in production with SSL)
# server {
#     listen 80;
#     server_name vunadigital.org www.vunadigital.org;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name _;

    # Gzip compression for faster load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets with long cache
    location / {
        proxy_pass http://vuna-digital-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prevent access to sensitive files
    location ~ /\. {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
