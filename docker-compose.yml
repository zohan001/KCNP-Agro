# ============================================
# Vuna Digital - Docker Compose Configuration
# ============================================
# Local development/production stack with a
# MongoDB database service.
# ============================================

services:
  # MongoDB database
  mongodb:
    image: mongo:4.4
    container_name: vuna-digital-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: verdant
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vuna-digital:latest
    container_name: vuna-digital-web
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/verdant
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb-data:
    driver: local
